# Font and window preferences.
font_family JetBrainsMono Nerd Font
font_size 12.0
modify_font cell_height 120%
window_padding_width 4
macos_titlebar_color background
remember_window_size no
initial_window_width 100c
initial_window_height 30c

# Official Dracula theme: https://draculatheme.com/kitty
include dracula.conf

# Compact tab labels: omit user@host from shell titles.
tab_title_template "{index}: {title.split(':', 1)[-1] if '@' in title.split(':', 1)[0] else title}"
tab_title_max_length 24
